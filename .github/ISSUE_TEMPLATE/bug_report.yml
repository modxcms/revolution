name: Bug Report
description: Report a reproducible bug in MODX Revolution.
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the sections below so we can reproduce and fix the issue.
        **Before submitting**, search [existing issues](https://github.com/modxcms/revolution/issues) to avoid duplicates.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: Quick summary of what this issue is about.
      placeholder: "e.g. Chunk cache not invalidated when resource is updated"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the issue. Include custom code or snippets if relevant.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Run snippet / do ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: How it should behave after following the steps above.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual / Observed Behavior
      description: How it actually behaved (error message, wrong output, etc.).
    validations:
      required: true

  - type: markdown
    attributes:
      value: "### Environment"

  - type: input
    id: modx_version
    attributes:
      label: MODX Version
      placeholder: "e.g. 3.0.4, 3.x branch, or commit hash"
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP Version
      placeholder: "e.g. 8.2"

  - type: input
    id: database
    attributes:
      label: Database Type & Version
      placeholder: "e.g. MySQL 8.0, MariaDB 10.6"

  - type: input
    id: server_browser
    attributes:
      label: Server / Web Server / Browser (if relevant)
      description: Apache/Nginx and version, or browser for front-end issues.
      placeholder: "e.g. Apache 2.4, Chrome 120"

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant error logs, stack traces, or console output.
      render: shell
      placeholder: "Paste here or attach a file if large."
